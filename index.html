<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>البذور الخمس والأخلاق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
 <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FCDF0"/><stop offset="1" stop-color="#E8F5FB"/></linearGradient>
 <linearGradient id="gEve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6B97A"/><stop offset=".6" stop-color="#FCE2B4"/><stop offset="1" stop-color="#FFF3DA"/></linearGradient>
 <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BD48F"/><stop offset="1" stop-color="#6CB86A"/></linearGradient>
 <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9784C"/><stop offset="1" stop-color="#B85A33"/></linearGradient>
 <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9945F"/><stop offset="1" stop-color="#9C6B3F"/></linearGradient>
 <radialGradient id="gGlow"><stop offset="0" stop-color="#FFE38A" stop-opacity=".95"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient>
 <radialGradient id="gQ" cx=".5" cy=".55" r=".75"><stop offset="0" stop-color="#FFF7DA"/><stop offset=".5" stop-color="#E5F2D8"/><stop offset="1" stop-color="#9FCB8E"/></radialGradient>
</defs></svg>
<div id="stage"><div id="board"></div><div id="stack"></div><div id="book"></div></div>
<div id="measure"></div>
<div id="ctl">
  <button type="button" id="back">→ الصفحة السابقة</button>
  <div id="ind" aria-live="polite">الغلاف</div>
  <button type="button" id="fwd">الصفحة التالية ←</button>
  <button type="button" id="start">هيا نقرأ القصة</button>
  <button type="button" id="cover">الغلاف</button>
  <button type="button" id="snd">🔊 الصوت</button>
  <button type="button" id="fs">ملء الشاشة</button>
</div>
<p id="hint"></p>
<script src="script.js"></script>
</body>
</html>
